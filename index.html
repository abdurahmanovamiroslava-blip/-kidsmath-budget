<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KidsMath — Бюджет</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f6fa;
    color: #222;
}

.header {
    background: #ffffff;
    padding: 20px;
    border-bottom: 1px solid #eee;
}

.header h1 {
    margin: 0;
    font-size: 26px;
}

.header p {
    margin: 6px 0 0;
    color: #777;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.card-title {
    color: #777;
    font-size: 14px;
}

.card-value {
    font-size: 25px;
    font-weight: bold;
    margin-top: 10px;
}

.section {
    background: white;
    margin-top: 20px;
    padding: 20px;
    border-radius: 16px;
}

.section h2 {
    margin-top: 0;
}

.form {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

label {
    font-size: 14px;
    color: #666;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
}

button {
    margin-top: 20px;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #111827;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.progress {
    height: 12px;
    background: #eee;
    border-radius: 20px;
    overflow: hidden;
    margin-top: 12px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #111827;
}

@media (max-width: 800px) {
    .cards {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 500px) {
    .cards {
        grid-template-columns: 1fr;
    }

    .form {
        grid-template-columns: 1fr;
    }

    .container {
        padding: 12px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>KidsMath 📊</h1>
    <p>Бюджетная панель учебного центра</p>
</div>

<div class="container">

    <div class="cards">

        <div class="card">
            <div class="card-title">Выручка за месяц</div>
            <div class="card-value" id="revenue">0 сум</div>
        </div>

        <div class="card">
            <div class="card-title">Расходы</div>
            <div class="card-value" id="expenses">0 сум</div>
        </div>

        <div class="card">
            <div class="card-title">Прибыль</div>
            <div class="card-value" id="profit">0 сум</div>
        </div>

        <div class="card">
            <div class="card-title">Остаток денег</div>
            <div class="card-value" id="balance">0 сум</div>
        </div>

        <div class="card">
            <div class="card-title">Долги учеников</div>
            <div class="card-value" id="debts">0 сум</div>
        </div>

        <div class="card">
            <div class="card-title">Количество учеников</div>
            <div class="card-value" id="students">0</div>
        </div>

        <div class="card">
            <div class="card-title">Средний чек</div>
            <div class="card-value" id="average">0 сум</div>
        </div>

        <div class="card">
            <div class="card-title">План</div>
            <div class="card-value" id="planResult">0 сум</div>
        </div>

    </div>

    <div class="section">

        <h2>✏️ Ввести данные</h2>

        <div class="form">

            <div>
                <label>Выручка</label>
                <input id="revenueInput" type="number" placeholder="Например: 50000000">
            </div>

            <div>
                <label>Расходы</label>
                <input id="expensesInput" type="number" placeholder="Например: 30000000">
            </div>

            <div>
                <label>Остаток денег</label>
                <input id="balanceInput" type="number" placeholder="Например: 20000000">
            </div>

            <div>
                <label>Долги учеников</label>
                <input id="debtsInput" type="number" placeholder="Например: 5000000">
            </div>

            <div>
                <label>Количество учеников</label>
                <input id="studentsInput" type="number" placeholder="Например: 120">
            </div>

            <div>
                <label>План по выручке</label>
                <input id="planInput" type="number" placeholder="Например: 60000000">
            </div>

        </div>

        <button onclick="updateDashboard()">
            Сохранить данные
        </button>

    </div>

    <div class="section">

        <h2>📈 План / факт</h2>

        <div>
            Факт: <strong id="factText">0 сум</strong>
        </div>

        <div>
            План: <strong id="planText">0 сум</strong>
        </div>

        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <p id="progressText">0% выполнения плана</p>

    </div>

</div>

<script>

function formatMoney(number) {
    return Number(number || 0).toLocaleString('ru-RU') + ' сум';
}

function updateDashboard() {

    const revenue =
        Number(document.getElementById('revenueInput').value) || 0;

    const expenses =
        Number(document.getElementById('expensesInput').value) || 0;

    const balance =
        Number(document.getElementById('balanceInput').value) || 0;

    const debts =
        Number(document.getElementById('debtsInput').value) || 0;

    const students =
        Number(document.getElementById('studentsInput').value) || 0;

    const plan =
        Number(document.getElementById('planInput').value) || 0;

    const profit = revenue - expenses;

    const average = students > 0
        ? revenue / students
        : 0;

    const percentage = plan > 0
        ? Math.min((revenue / plan) * 100, 100)
        : 0;

    document.getElementById('revenue').textContent =
        formatMoney(revenue);

    document.getElementById('expenses').textContent =
        formatMoney(expenses);

    document.getElementById('profit').textContent =
        formatMoney(profit);

    document.getElementById('balance').textContent =
        formatMoney(balance);

    document.getElementById('debts').textContent =
        formatMoney(debts);

    document.getElementById('students').textContent =
        students.toLocaleString('ru-RU');

    document.getElementById('average').textContent =
        formatMoney(average);

    document.getElementById('planResult').textContent =
        formatMoney(plan);

    document.getElementById('factText').textContent =
        formatMoney(revenue);

    document.getElementById('planText').textContent =
        formatMoney(plan);

    document.getElementById('progressBar').style.width =
        percentage + '%';

    document.getElementById('progressText').textContent =
        Math.round(percentage) + '% выполнения плана';

    localStorage.setItem('kidsmathData', JSON.stringify({
        revenue,
        expenses,
        balance,
        debts,
        students,
        plan
    }));
}

function loadDashboard() {

    const saved =
        localStorage.getItem('kidsmathData');

    if (!saved) return;

    const data = JSON.parse(saved);

    document.getElementById('revenueInput').value = data.revenue;
    document.getElementById('expensesInput').value = data.expenses;
    document.getElementById('balanceInput').value = data.balance;
    document.getElementById('debtsInput').value = data.debts;
    document.getElementById('studentsInput').value = data.students;
    document.getElementById('planInput').value = data.plan;

    updateDashboard();
}

loadDashboard();

</script>

</body>
</html>
