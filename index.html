<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KidsMath Budget</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    margin:0;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
}

.box{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:15px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

input,select{
    width:100%;
    padding:12px;
    margin:6px 0 15px;
    border:1px solid #ddd;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    padding:12px 18px;
    border:0;
    border-radius:8px;
    background:#111827;
    color:white;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.success{
    color:green;
    font-weight:bold;
}

.error{
    color:red;
    font-weight:bold;
}

.student{
    padding:12px;
    border-bottom:1px solid #eee;
}
</style>
</head>

<body>

<div class="container">

<h1>KidsMath Budget 📊</h1>

<div class="box">

<h2>➕ Добавить ученика</h2>

<label>Имя и фамилия</label>

<input
    id="studentName"
    placeholder="Например: Алиса Иванова"
>

<label>Группа</label>

<input
    id="studentGroup"
    placeholder="Например: Math-1"
>

<label>Дата начала</label>

<input
    type="date"
    id="studentStart"
>

<label>Статус</label>

<select id="studentStatus">

<option value="active">
🟢 Активный
</option>

<option value="inactive">
🔴 Неактивный
</option>

</select>

<button onclick="addStudent()">
💾 Сохранить ученика
</button>

<p id="message"></p>

</div>


<div class="box">

<h2>👨‍🎓 Ученики</h2>

<button onclick="loadStudents()">
🔄 Обновить список
</button>

<div id="studentsList">
Загрузка...
</div>

</div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://xdzslvibvolrfljfmsyd.supabase.co";


const SUPABASE_KEY =
"sb_publishable_hxhDhSs8NgoAvF9ohcoEug_1tLXcfvl";


const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   ДАТА
========================================= */

document.getElementById("studentStart").value =
new Date().toISOString().slice(0,10);


/* =========================================
   ДОБАВИТЬ УЧЕНИКА
========================================= */

async function addStudent(){

    const name =
        document.getElementById("studentName").value.trim();

    const group =
        document.getElementById("studentGroup").value.trim();

    const start =
        document.getElementById("studentStart").value;

    const status =
        document.getElementById("studentStatus").value;


    const message =
        document.getElementById("message");


    if(!name){

        message.className="error";

        message.textContent =
        "Введите имя ученика";

        return;
    }


    message.textContent =
    "Сохраняем...";


    const {data,error} = await db
        .from("students")
        .insert([{

            name:name,

            group_name:group,

            start_date:start,

            status:status

        }])
        .select();


    if(error){

        console.error(error);

        message.className="error";

        message.textContent =
        "Ошибка: "+error.message;

        return;
    }


    message.className="success";

    message.textContent =
    "✅ Ученик сохранён в базе Supabase";


    document.getElementById("studentName").value="";
    document.getElementById("studentGroup").value="";


    loadStudents();
}


/* =========================================
   ЗАГРУЗИТЬ УЧЕНИКОВ
========================================= */

async function loadStudents(){

    const list =
        document.getElementById("studentsList");


    list.innerHTML =
        "Загрузка...";


    const {data,error} = await db
        .from("students")
        .select("*")
        .order("id",{ascending:false});


    if(error){

        console.error(error);

        list.innerHTML =
        `<p class="error">
        Ошибка загрузки: ${error.message}
        </p>`;

        return;
    }


    if(!data || data.length===0){

        list.innerHTML =
        "<p>Пока нет учеников.</p>";

        return;
    }


    list.innerHTML = "";


    data.forEach((student,index)=>{

        const div =
        document.createElement("div");

        div.className="student";


        div.innerHTML=`

            <b>${index+1}. ${student.name}</b>

            <br>

            Группа:
            ${student.group_name || "—"}

            <br>

            Дата начала:
            ${student.start_date || "—"}

            <br>

            Статус:
            ${
                student.status==="active"
                ? "🟢 Активный"
                : "🔴 Неактивный"
            }

        `;


        list.appendChild(div);

    });

}


/* =========================================
   СТАРТ
========================================= */

loadStudents();

</script>

</body>
</html>
