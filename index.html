<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KidsMath — Финансовая панель</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f6fa;
    color:#222;
}

.header{
    background:#fff;
    padding:22px;
    border-bottom:1px solid #eee;
}

.header h1{
    margin:0;
    font-size:28px;
}

.header p{
    margin:6px 0 0;
    color:#777;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.card{
    background:#fff;
    border-radius:16px;
    padding:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.card-title{
    color:#777;
    font-size:14px;
}

.card-value{
    font-size:23px;
    font-weight:bold;
    margin-top:10px;
}

.section{
    background:#fff;
    margin-top:20px;
    padding:20px;
    border-radius:16px;
    box-shadow:0 3px 12px rgba(0,0,0,.04);
}

.section h2{
    margin-top:0;
}

.form{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

label{
    display:block;
    color:#666;
    font-size:14px;
}

input,select{
    width:100%;
    padding:12px;
    margin-top:6px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
}

button{
    border:none;
    border-radius:10px;
    padding:12px 18px;
    color:white;
    background:#111827;
    font-size:15px;
    cursor:pointer;
}

.add-btn{
    width:100%;
    margin-top:20px;
}

.delete{
    background:#dc2626;
    padding:7px 10px;
    font-size:13px;
}

.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    padding:12px 8px;
    border-bottom:1px solid #eee;
    text-align:left;
    white-space:nowrap;
}

.empty{
    text-align:center;
    color:#777;
    padding:20px;
}

.summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-top:15px;
}

.summary-box{
    background:#f5f6fa;
    padding:15px;
    border-radius:12px;
}

.summary-box strong{
    display:block;
    font-size:20px;
    margin-top:6px;
}

@media(max-width:800px){
    .cards{
        grid-template-columns:repeat(2,1fr);
    }

    .summary{
        grid-template-columns:1fr;
    }
}

@media(max-width:500px){
    .cards,.form{
        grid-template-columns:1fr;
    }

    .container{
        padding:12px;
    }

    table{
        font-size:13px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>KidsMath 📊</h1>
    <p>Финансовая панель учебного центра</p>
</div>

<div class="container">

<!-- ================= DASHBOARD ================= -->

<div class="cards">

    <div class="card">
        <div class="card-title">💰 Выручка</div>
        <div class="card-value" id="revenue">0 сум</div>
    </div>

    <div class="card">
        <div class="card-title">💸 Расходы</div>
        <div class="card-value" id="expenses">0 сум</div>
    </div>

    <div class="card">
        <div class="card-title">📈 Прибыль</div>
        <div class="card-value" id="profit">0 сум</div>
    </div>

    <div class="card">
        <div class="card-title">👨‍🎓 Ученики</div>
        <div class="card-value" id="studentCount">0</div>
    </div>

</div>


<!-- ================= INCOME ================= -->

<div class="section">

<h2>💰 Доходы</h2>

<div class="form">

<div>
<label>Дата</label>
<input type="date" id="incomeDate">
</div>

<div>
<label>Ученик</label>
<input type="text" id="incomeStudent" placeholder="Имя ученика">
</div>

<div>
<label>Группа</label>
<input type="text" id="incomeGroup" placeholder="Например: Math 5">
</div>

<div>
<label>Сумма</label>
<input type="number" id="incomeAmount" placeholder="500000">
</div>

<div>
<label>Способ оплаты</label>
<select id="incomePayment">
<option>Наличные</option>
<option>Карта</option>
<option>Перевод</option>
</select>
</div>

<div>
<label>Комментарий</label>
<input type="text" id="incomeComment" placeholder="Оплата за месяц">
</div>

</div>

<button class="add-btn" onclick="addIncome()">
➕ Добавить доход
</button>

<div id="incomeTable"></div>

</div>


<!-- ================= EXPENSES ================= -->

<div class="section">

<h2>💸 Расходы</h2>

<div class="form">

<div>
<label>Дата</label>
<input type="date" id="expenseDate">
</div>

<div>
<label>Категория</label>
<select id="expenseCategory">
<option>Аренда</option>
<option>Зарплата</option>
<option>Реклама</option>
<option>Коммунальные услуги</option>
<option>Заправка</option>
<option>Оборудование</option>
<option>Кредит</option>
<option>Прочее</option>
</select>
</div>

<div>
<label>Сумма</label>
<input type="number" id="expenseAmount" placeholder="1000000">
</div>

<div>
<label>Способ оплаты</label>
<select id="expensePayment">
<option>Наличные</option>
<option>Карта</option>
<option>Перевод</option>
</select>
</div>

<div>
<label>Комментарий</label>
<input type="text" id="expenseComment" placeholder="Описание расхода">
</div>

</div>

<button class="add-btn" onclick="addExpense()">
➕ Добавить расход
</button>

<div id="expenseTable"></div>

</div>


<!-- ================= STUDENTS ================= -->

<div class="section">

<h2>👨‍🎓 Ученики и долги</h2>

<div class="summary">

<div class="summary-box">
Всего учеников
<strong id="studentsTotal">0</strong>
</div>

<div class="summary-box">
Оплачено
<strong id="studentsPaid">0 сум</strong>
</div>

<div class="summary-box">
Общий долг
<strong id="studentsDebt">0 сум</strong>
</div>

</div>


<div class="form" style="margin-top:20px">

<div>
<label>Имя и фамилия</label>
<input type="text" id="studentName" placeholder="Алиса Абдуллаева">
</div>

<div>
<label>Группа</label>
<input type="text" id="studentGroup" placeholder="Math 5">
</div>

<div>
<label>Стоимость обучения</label>
<input type="number" id="studentPrice" placeholder="500000">
</div>

<div>
<label>Оплачено</label>
<input type="number" id="studentPaidInput" placeholder="500000">
</div>

<div>
<label>Период</label>
<input type="text" id="studentPeriod" placeholder="Сентябрь 2026">
</div>

<div>
<label>Комментарий</label>
<input type="text" id="studentComment" placeholder="Комментарий">
</div>

</div>

<button class="add-btn" onclick="addStudent()">
➕ Добавить ученика
</button>

<div id="studentTable"></div>

</div>


<!-- ================= RESULT ================= -->

<div class="section">

<h2>📊 Финансовый результат</h2>

<div class="summary">

<div class="summary-box">
Выручка
<strong id="resultRevenue">0 сум</strong>
</div>

<div class="summary-box">
Расходы
<strong id="resultExpenses">0 сум</strong>
</div>

<div class="summary-box">
Прибыль
<strong id="resultProfit">0 сум</strong>
</div>

</div>

</div>

</div>


<script>

/* ================= DATA ================= */

let incomes =
JSON.parse(localStorage.getItem("kidsmathIncomes") || "[]");

let expenses =
JSON.parse(localStorage.getItem("kidsmathExpenses") || "[]");

let students =
JSON.parse(localStorage.getItem("kidsmathStudents") || "[]");


/* ================= HELPERS ================= */

function money(number){
return Number(number).toLocaleString("ru-RU") + " сум";
}

function saveData(){

localStorage.setItem(
"kidsmathIncomes",
JSON.stringify(incomes)
);

localStorage.setItem(
"kidsmathExpenses",
JSON.stringify(expenses)
);

localStorage.setItem(
"kidsmathStudents",
JSON.stringify(students)
);

}


/* ================= INCOME ================= */

function addIncome(){

const date =
document.getElementById("incomeDate").value;

const student =
document.getElementById("incomeStudent").value.trim();

const group =
document.getElementById("incomeGroup").value.trim();

const amount =
Number(document.getElementById("incomeAmount").value);

const payment =
document.getElementById("incomePayment").value;

const comment =
document.getElementById("incomeComment").value.trim();

if(!date || !student || !amount){

alert("Заполни дату, ученика и сумму.");

return;
}

incomes.push({
id:Date.now(),
date,
student,
group,
amount,
payment,
comment
});

saveData();

document.getElementById("incomeStudent").value="";
document.getElementById("incomeGroup").value="";
document.getElementById("incomeAmount").value="";
document.getElementById("incomeComment").value="";

render();

}


/* ================= EXPENSE ================= */

function addExpense(){

const date =
document.getElementById("expenseDate").value;

const category =
document.getElementById("expenseCategory").value;

const amount =
Number(document.getElementById("expenseAmount").value);

const payment =
document.getElementById("expensePayment").value;

const comment =
document.getElementById("expenseComment").value.trim();

if(!date || !amount){

alert("Заполни дату и сумму.");

return;
}

expenses.push({
id:Date.now(),
date,
category,
amount,
payment,
comment
});

saveData();

document.getElementById("expenseAmount").value="";
document.getElementById("expenseComment").value="";

render();

}


/* ================= STUDENTS ================= */

function addStudent(){

const name =
document.getElementById("studentName").value.trim();

const group =
document.getElementById("studentGroup").value.trim();

const price =
Number(document.getElementById("studentPrice").value);

const paid =
Number(document.getElementById("studentPaidInput").value);

const period =
document.getElementById("studentPeriod").value.trim();

const comment =
document.getElementById("studentComment").value.trim();

if(!name || !price){

alert("Заполни имя ученика и стоимость обучения.");

return;
}

const debt =
Math.max(price - paid, 0);

students.push({
id:Date.now(),
name,
group,
price,
paid,
debt,
period,
comment
});

saveData();

document.getElementById("studentName").value="";
document.getElementById("studentGroup").value="";
document.getElementById("studentPrice").value="";
document.getElementById("studentPaidInput").value="";
document.getElementById("studentPeriod").value="";
document.getElementById("studentComment").value="";

render();

}


/* ================= DELETE ================= */

function deleteIncome(id){

incomes =
incomes.filter(item => item.id !== id);

saveData();

render();

}


function deleteExpense(id){

expenses =
expenses.filter(item => item.id !== id);

saveData();

render();

}


function deleteStudent(id){

students =
students.filter(item => item.id !== id);

saveData();

render();

}


/* ================= INCOME TABLE ================= */

function renderIncome(){

const container =
document.getElementById("incomeTable");

if(incomes.length === 0){

container.innerHTML =
'<div class="empty">Пока нет доходов</div>';

return;
}

let html = `

<div class="table-wrapper">

<table>

<thead>

<tr>
<th>Дата</th>
<th>Ученик</th>
<th>Группа</th>
<th>Сумма</th>
<th>Оплата</th>
<th></th>
</tr>

</thead>

<tbody>
`;

incomes.slice().reverse().forEach(item => {

html += `

<tr>

<td>${item.date}</td>

<td>${item.student}</td>

<td>${item.group}</td>

<td>${money(item.amount)}</td>

<td>${item.payment}</td>

<td>
<button
class="delete"
onclick="deleteIncome(${item.id})">
Удалить
</button>
</td>

</tr>
`;

});

html += `
</tbody>
</table>
</div>
`;

container.innerHTML = html;

}


/* ================= EXPENSE TABLE ================= */

function renderExpenses(){

const container =
document.getElementById("expenseTable");

if(expenses.length === 0){

container.innerHTML =
'<div class="empty">Пока нет расходов</div>';

return;
}

let html = `

<div class="table-wrapper">

<table>

<thead>

<tr>
<th>Дата</th>
<th>Категория</th>
<th>Сумма</th>
<th>Оплата</th>
<th>Комментарий</th>
<th></th>
</tr>

</thead>

<tbody>
`;

expenses.slice().reverse().forEach(item => {

html += `

<tr>

<td>${item.date}</td>

<td>${item.category}</td>

<td>${money(item.amount)}</td>

<td>${item.payment}</td>

<td>${item.comment}</td>

<td>
<button
class="delete"
onclick="deleteExpense(${item.id})">
Удалить
</button>
</td>

</tr>
`;

});

html += `
</tbody>
</table>
</div>
`;

container.innerHTML = html;

}


/* ================= STUDENT TABLE ================= */

function renderStudents(){

const container =
document.getElementById("studentTable");

if(students.length === 0){

container.innerHTML =
'<div class="empty">Пока нет учеников</div>';

return;
}

let html = `

<div class="table-wrapper">

<table>

<thead>

<tr>
<th>Ученик</th>
<th>Группа</th>
<th>Стоимость</th>
<th>Оплачено</th>
<th>Долг</th>
<th>Период</th>
<th>Статус</th>
<th></th>
</tr>

</thead>

<tbody>
`;

students.slice().reverse().forEach(item => {

let status = "Долг";

if(item.debt === 0){
status = "Оплачено";
}
else if(item.paid > 0){
status = "Частично";
}

html += `

<tr>

<td>${item.name}</td>

<td>${item.group}</td>

<td>${money(item.price)}</td>

<td>${money(item.paid)}</td>

<td>${money(item.debt)}</td>

<td>${item.period}</td>

<td>${status}</td>

<td>

<button
class="delete"
onclick="deleteStudent(${item.id})">
Удалить
</button>

</td>

</tr>
`;

});

html += `
</tbody>
</table>
</div>
`;

container.innerHTML = html;

}


/* ================= DASHBOARD ================= */

function render(){

const revenue =
incomes.reduce(
(sum,item) => sum + item.amount,
0
);

const totalExpenses =
expenses.reduce(
(sum,item) => sum + item.amount,
0
);

const profit =
revenue - totalExpenses;

const totalPaid =
students.reduce(
(sum,item) => sum + item.paid,
0
);

const totalDebt =
students.reduce(
(sum,item) => sum + item.debt,
0
);


document.getElementById("revenue").textContent =
money(revenue);

document.getElementById("expenses").textContent =
money(totalExpenses);

document.getElementById("profit").textContent =
money(profit);

document.getElementById("studentCount").textContent =
students.length;

document.getElementById("studentsTotal").textContent =
students.length;

document.getElementById("studentsPaid").textContent =
money(totalPaid);

document.getElementById("studentsDebt").textContent =
money(totalDebt);

document.getElementById("resultRevenue").textContent =
money(revenue);

document.getElementById("resultExpenses").textContent =
money(totalExpenses);

document.getElementById("resultProfit").textContent =
money(profit);

renderIncome();

renderExpenses();

renderStudents();

}


/* ================= DATE ================= */

const today =
new Date().toISOString().split("T")[0];

document.getElementById("incomeDate").value =
today;

document.getElementById("expenseDate").value =
today;


/* ================= START ================= */

render();

</script>

</body>
</html>
