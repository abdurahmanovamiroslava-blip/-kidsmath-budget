<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KidsMath — Финансы</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f6fa;
    color:#222;
}

.header{
    background:#fff;
    padding:20px;
    border-bottom:1px solid #eee;
}

.header h1{margin:0}
.header p{color:#777}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.card{
    background:#fff;
    border-radius:16px;
    padding:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.card-title{
    color:#777;
    font-size:14px;
}

.card-value{
    font-size:24px;
    font-weight:bold;
    margin-top:10px;
}

.section{
    background:#fff;
    margin-top:20px;
    padding:20px;
    border-radius:16px;
}

.form{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

label{
    display:block;
    color:#666;
    font-size:14px;
}

input,select{
    width:100%;
    padding:12px;
    margin-top:6px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
}

button{
    padding:12px 18px;
    border:0;
    border-radius:10px;
    background:#111827;
    color:white;
    font-size:15px;
    cursor:pointer;
}

.add-btn{
    margin-top:20px;
    width:100%;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    padding:12px 8px;
    border-bottom:1px solid #eee;
    text-align:left;
}

.delete{
    background:#dc2626;
    padding:7px 10px;
    font-size:13px;
}

.empty{
    color:#777;
    text-align:center;
    padding:20px;
}

@media(max-width:800px){
    .cards{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:500px){
    .cards,.form{
        grid-template-columns:1fr;
    }

    .container{
        padding:12px;
    }

    table{
        font-size:13px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>KidsMath 📊</h1>
    <p>Финансовая панель учебного центра</p>
</div>

<div class="container">

    <div class="cards">

        <div class="card">
            <div class="card-title">Выручка</div>
            <div class="card-value" id="revenue">0 сум</div>
        </div>

        <div class="card">
            <div class="card-title">Расходы</div>
            <div class="card-value" id="expenses">0 сум</div>
        </div>

        <div class="card">
            <div class="card-title">Прибыль</div>
            <div class="card-value" id="profit">0 сум</div>
        </div>

        <div class="card">
            <div class="card-title">Количество оплат</div>
            <div class="card-value" id="payments">0</div>
        </div>

    </div>


    <div class="section">

        <h2>💰 Доходы</h2>

        <div class="form">

            <div>
                <label>Дата</label>
                <input type="date" id="date">
            </div>

            <div>
                <label>Ученик</label>
                <input type="text" id="student" placeholder="Имя ученика">
            </div>

            <div>
                <label>Группа</label>
                <input type="text" id="group" placeholder="Например: Math 5">
            </div>

            <div>
                <label>Сумма</label>
                <input type="number" id="amount" placeholder="500000">
            </div>

            <div>
                <label>Способ оплаты</label>
                <select id="payment">
                    <option value="Наличные">Наличные</option>
                    <option value="Карта">Карта</option>
                    <option value="Перевод">Перевод</option>
                </select>
            </div>

            <div>
                <label>Комментарий</label>
                <input type="text" id="comment" placeholder="Например: оплата за сентябрь">
            </div>

        </div>

        <button class="add-btn" onclick="addIncome()">
            ➕ Добавить доход
        </button>

    </div>


    <div class="section">

        <h2>📋 История доходов</h2>

        <div id="incomeTable"></div>

    </div>

</div>


<script>

let incomes = JSON.parse(
    localStorage.getItem("kidsmathIncomes") || "[]"
);

function money(number){
    return Number(number).toLocaleString("ru-RU") + " сум";
}


function addIncome(){

    const date = document.getElementById("date").value;
    const student = document.getElementById("student").value.trim();
    const group = document.getElementById("group").value.trim();
    const amount = Number(document.getElementById("amount").value);
    const payment = document.getElementById("payment").value;
    const comment = document.getElementById("comment").value.trim();

    if(!date || !student || !amount){
        alert("Заполни дату, ученика и сумму.");
        return;
    }

    const income = {
        id: Date.now(),
        date,
        student,
        group,
        amount,
        payment,
        comment
    };

    incomes.push(income);

    localStorage.setItem(
        "kidsmathIncomes",
        JSON.stringify(incomes)
    );

    document.getElementById("student").value="";
    document.getElementById("group").value="";
    document.getElementById("amount").value="";
    document.getElementById("comment").value="";

    render();
}


function deleteIncome(id){

    incomes = incomes.filter(
        income => income.id !== id
    );

    localStorage.setItem(
        "kidsmathIncomes",
        JSON.stringify(incomes)
    );

    render();
}


function render(){

    let total = incomes.reduce(
        (sum,income) => sum + income.amount,
        0
    );

    document.getElementById("revenue").textContent =
        money(total);

    document.getElementById("payments").textContent =
        incomes.length;

    document.getElementById("expenses").textContent =
        "0 сум";

    document.getElementById("profit").textContent =
        money(total);


    const table = document.getElementById("incomeTable");

    if(incomes.length === 0){

        table.innerHTML =
            '<div class="empty">Пока нет доходов</div>';

        return;
    }


    let html = `
        <table>
            <thead>
                <tr>
                    <th>Дата</th>
                    <th>Ученик</th>
                    <th>Группа</th>
                    <th>Сумма</th>
                    <th>Оплата</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
    `;


    incomes
        .slice()
        .reverse()
        .forEach(income => {

            html += `
                <tr>
                    <td>${income.date}</td>
                    <td>${income.student}</td>
                    <td>${income.group}</td>
                    <td>${money(income.amount)}</td>
                    <td>${income.payment}</td>
                    <td>
                        <button
                            class="delete"
                            onclick="deleteIncome(${income.id})">
                            Удалить
                        </button>
                    </td>
                </tr>
            `;

        });


    html += `
            </tbody>
        </table>
    `;

    table.innerHTML = html;
}


document.getElementById("date").value =
    new Date().toISOString().split("T")[0];

render();

</script>

</body>
</html>
